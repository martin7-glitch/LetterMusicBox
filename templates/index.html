<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5f9">
    <title>LetterMusicBox | Mejor que ayer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Tu biblioteca personal</p>
          <h1>LetterMusicBox</h1>
          <p class="subtitle">Como Letterbox, pero para música.</p>
        </div>
        <div class="header-tools">
          <div class="user-session">
            <img id="header-avatar" class="profile-avatar" src="{{ avatar_url }}" alt="Foto de perfil de {{ username }}">
            <span>{{ username }}</span>
            <form method="post" action="{{ url_for('logout') }}">
              <button class="button button-quiet" type="submit">Cerrar sesión</button>
            </form>
          </div>
          <img class="logo" src="{{ url_for('logo') }}" alt="Logo de LetterMusicBox">
        </div>
      </header>

      <nav class="view-tabs" aria-label="Secciones de la aplicación">
        <button class="button button-primary" id="library-tab" type="button" aria-current="page">Mi biblioteca</button>
        <button class="button button-quiet" id="members-tab" type="button" aria-current="false">Miembros</button>
        <button class="button button-quiet" id="account-tab" type="button" aria-current="false">Cuenta</button>
      </nav>

      <div id="library-view">
        <section class="panel" aria-labelledby="form-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Biblioteca</p>
              <h2 id="form-title">Agregar canción</h2>
            </div>
            <button class="button button-quiet hidden" id="cancel-edit" type="button">Cancelar edición</button>
          </div>
          <form id="song-form">
            <div class="form-grid">
              <label>
                Nombre
                <input name="nombre" maxlength="200" required autocomplete="off">
              </label>
              <label>
                Artista
                <input name="artista" maxlength="200" required autocomplete="off">
              </label>
              <label>
                Género
                <select name="genero" required>
                  {% for genero in generos %}
                  <option value="{{ genero }}">{{ genero }}</option>
                  {% endfor %}
                </select>
              </label>
              <label class="rating-field">
                Calificación: <output id="rating-value">0.0 / 5</output>
                <input name="calificacion" id="rating" type="range" min="0" max="5" step="0.5" value="0">
              </label>
              <label class="log-field">
                Log
                <textarea name="log" maxlength="5000" rows="3" placeholder="¿Qué te pareció?"></textarea>
              </label>
              <label class="image-field">
                Portada
                <input name="image" id="image" type="file" accept="image/png,image/jpeg,image/gif,image/bmp,image/webp">
                <span class="image-note">PNG, JPG, GIF, BMP o WEBP · máximo 5 MB</span>
                <img id="image-preview" class="image-preview hidden" alt="Vista previa de la portada">
                <span class="remove-image hidden" id="remove-image-wrap">
                  <input id="remove-image" type="checkbox">
                  Quitar portada actual
                </span>
              </label>
            </div>
            <div class="form-actions">
              <button class="button button-primary" id="save-button" type="submit">Agregar canción</button>
              <button class="button button-quiet" id="clear-button" type="button">Limpiar</button>
            </div>
          </form>
        </section>

        <section class="library" aria-labelledby="library-title">
          <div class="section-heading library-heading">
            <div>
              <p class="eyebrow">Explorar</p>
              <h2 id="library-title">Tu música</h2>
            </div>
            <p id="song-count" class="song-count">Cargando…</p>
          </div>
          <div class="filters">
            <label class="search-field">
              <span class="sr-only">Buscar canción o artista</span>
              <input id="search" type="search" placeholder="Buscar canción o artista…" autocomplete="off">
            </label>
            <label>
              <span class="sr-only">Filtrar por género</span>
              <select id="genre-filter">
                <option value="">Todos los géneros</option>
                {% for genero in generos %}
                <option value="{{ genero }}">{{ genero }}</option>
                {% endfor %}
              </select>
            </label>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <div id="song-list" class="song-grid"></div>
        </section>
      </div>

      <section id="members-view" class="members-view hidden" aria-labelledby="members-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Comunidad</p>
            <h2 id="members-title">Miembros</h2>
          </div>
        </div>
        <p id="members-status" class="status" role="status" aria-live="polite"></p>
        <div id="member-list" class="member-grid"></div>
        <div id="member-profile" class="hidden">
          <div class="member-profile-heading">
            <button class="button button-quiet" id="back-to-members" type="button">Volver a miembros</button>
            <div id="member-profile-avatar" class="member-profile-avatar" aria-hidden="true"></div>
            <h2 id="member-name"></h2>
          </div>
          <p id="member-profile-status" class="status" role="status" aria-live="polite"></p>
          <div id="member-song-list" class="song-grid"></div>
        </div>
      </section>

      <section id="account-view" class="account-view hidden" aria-labelledby="account-title">
        <section class="panel" aria-labelledby="account-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Cuenta</p>
              <h2 id="account-title">Mi cuenta</h2>
            </div>
          </div>
          <div class="account-profile">
            <img id="account-avatar" class="account-avatar" src="{{ avatar_url }}" alt="Foto de perfil de {{ username }}">
            <form id="avatar-form" class="account-form">
              <h3>Foto de perfil</h3>
              <p class="account-note">Puedes cambiar la imagen asignada a tu cuenta cuando quieras.</p>
              <label class="button button-quiet avatar-file-label" for="avatar-input">Elegir foto</label>
              <input id="avatar-input" class="sr-only" type="file" name="avatar" accept="image/png,image/jpeg,image/gif,image/bmp,image/webp">
              <button class="button button-primary" id="avatar-save" type="submit" disabled>Guardar foto</button>
              <p id="avatar-status" class="status" role="status" aria-live="polite"></p>
            </form>
          </div>
        </section>

        <section class="panel" aria-labelledby="password-title">
          <h2 id="password-title">Cambiar contraseña</h2>
          <form id="password-form" class="account-form">
            <label>
              Contraseña actual
              <input name="current_password" type="password" autocomplete="current-password" required>
            </label>
            <label>
              Nueva contraseña
              <input name="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            </label>
            <label>
              Confirmar nueva contraseña
              <input name="confirm_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            </label>
            <button class="button button-primary" id="password-save" type="submit">Actualizar contraseña</button>
            <p id="password-status" class="status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>
  </body>
</html>
